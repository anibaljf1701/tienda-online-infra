<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found</title>
  <style>
    *, *::before, *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #333;
      min-height: 100vh;
    }

    /* ── Header ── */
    header {
      background-color: #1a1a2e;
      color: #fff;
      padding: 1.25rem 2rem;
      display: flex;
      align-items: center;
      gap: 1rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.3);
    }

    header h1 {
      font-size: 1.6rem;
      font-weight: 700;
      letter-spacing: 0.5px;
    }

    /* ── Main content ── */
    main {
      max-width: 1100px;
      margin: 2rem auto;
      padding: 0 1.5rem;
    }

    main h2 {
      font-size: 1.2rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
      color: #555;
    }

    /* ── Error card ── */
    .error-card {
      background-color: #fff;
      border-radius: 10px;
      padding: 3rem 2rem;
      box-shadow: 0 1px 4px rgba(0,0,0,0.08);
      text-align: center;
      max-width: 480px;
      margin: 4rem auto;
    }

    .error-code {
      font-size: 5rem;
      font-weight: 700;
      color: #e74c3c;
      line-height: 1;
      margin-bottom: 0.5rem;
    }

    .error-title {
      font-size: 1.4rem;
      font-weight: 600;
      color: #1a1a2e;
      margin-bottom: 0.75rem;
    }

    .error-message {
      font-size: 0.95rem;
      color: #777;
      margin-bottom: 2rem;
      line-height: 1.5;
    }

    .back-link {
      display: inline-block;
      padding: 0.65rem 1.5rem;
      background-color: #1a1a2e;
      color: #fff;
      text-decoration: none;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .back-link:hover {
      background-color: #16213e;
    }

    /* ── Footer ── */
    footer {
      text-align: center;
      padding: 2rem;
      color: #999;
      font-size: 0.82rem;
    }
  </style>
</head>
<body>

  <header>
    <h1>Tienda Online</h1>
  </header>

  <main>
    <div class="error-card">
      <div class="error-code">404</div>
      <div class="error-title">Page Not Found</div>
      <p class="error-message">
        The page you are looking for does not exist or has been moved.
      </p>
      <a href="index.html" class="back-link">Back to Product Catalog</a>
    </div>
  </main>

  <footer>
    &copy; Tienda Online
  </footer>

</body>
</html>
